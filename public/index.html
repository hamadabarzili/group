<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>غرفة المحادثة الصوتية والوسائط العامة</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            },
            dark: {
              bg: '#0b0f19',
              card: '#111827',
              border: '#1f2937',
              input: '#1a2234'
            }
          }
        }
      }
    }
  </script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- PeerJS for WebRTC Direct Mesh Connection -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #0b0f19; }
    ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #374151; }
    .recording-pulse { animation: pulse-ring 1.2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
  </style>
</head>
<body class="bg-dark-bg text-gray-100 font-sans antialiased h-screen overflow-hidden flex flex-col justify-between">

  <!-- ================= MAIN CHAT HEADER ================= -->
  <header class="bg-dark-card border-b border-gray-800 px-4 py-3 flex items-center justify-between z-20">
    <div class="flex items-center gap-3">
      <div class="relative">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center text-white text-lg font-bold shadow">
          🎙️
        </div>
        <span id="statusIndicator" class="absolute bottom-0 right-0 w-3 h-3 bg-amber-500 border-2 border-dark-card rounded-full"></span>
      </div>
      <div>
        <h1 class="text-sm font-bold text-white flex items-center gap-2">
          محادثة مباشرة للجميع
          <span class="bg-brand-500/10 text-brand-500 text-[10px] px-2 py-0.5 rounded border border-brand-500/20">بدون حسابات</span>
        </h1>
        <p class="text-xs text-gray-400" id="connectionStatus"><i class="fa-solid fa-circle-notch fa-spin text-amber-400 text-[10px] ml-1"></i> جاري إعداد الغرفة...</p>
      </div>
    </div>

    <!-- Active User Counter & Dynamic Identity -->
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2 bg-dark-bg border border-gray-800 px-3 py-1.5 rounded-xl">
        <img id="headerAvatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=Guest" class="w-7 h-7 rounded-lg bg-gray-800">
        <span id="headerName" class="text-xs font-semibold text-gray-200">زائر</span>
      </div>
    </div>
  </header>


  <!-- ================= CHAT MESSAGES FEED ================= -->
  <main class="flex-1 overflow-y-auto p-4 space-y-4 max-w-4xl w-full mx-auto" id="feedContainer">
    <!-- Welcome Info Banner -->
    <div class="bg-dark-card/90 border border-gray-800 rounded-2xl p-4 text-center max-w-md mx-auto shadow-lg my-2">
      <div class="text-2xl mb-1">⚡</div>
      <h3 class="text-xs font-bold text-white">غرفة المحادثة المباشرة المفتوحة</h3>
      <p class="text-[11px] text-gray-400 mt-1">يمكن للجميع الآن التحدث مباشرة، إرسال الصور والتسجيلات الصوتية دون الحاجة لتسجيل الدخول.</p>
    </div>

    <!-- Dynamic Messages Append Target -->
    <div id="messagesList" class="space-y-4"></div>
  </main>


  <!-- ================= CONTROLS & INPUT BAR ================= -->
  <footer class="bg-dark-card border-t border-gray-800 p-3 sm:p-4 z-10">
    <div class="max-w-4xl mx-auto flex flex-col gap-2">
      
      <!-- Audio Recording Banner (Hidden by default) -->
      <div id="recordingBanner" class="hidden flex items-center justify-between bg-red-950/40 border border-red-800/50 p-2.5 rounded-xl text-red-400 text-xs animate-pulse">
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 bg-red-500 rounded-full recording-pulse"></span>
          <span>جاري تسجيل الملاحظة الصوتية... (<span id="recordTimer">00:00</span>)</span>
        </div>
        <div class="flex gap-2">
          <button onclick="cancelRecording()" class="px-2.5 py-1 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-lg">إلغاء</button>
          <button onclick="stopAndSendRecording()" class="px-3 py-1 bg-red-600 hover:bg-red-500 text-white font-bold rounded-lg">إرسال الصوت</button>
        </div>
      </div>

      <!-- Main Input Controls -->
      <form id="chatForm" onsubmit="handleSendText(event)" class="flex items-center gap-2">
        
        <!-- Image Upload Button -->
        <label class="p-3 text-gray-400 hover:text-brand-500 bg-dark-bg border border-gray-800 rounded-xl transition cursor-pointer flex-shrink-0" title="إرسال صورة">
          <i class="fa-solid fa-camera text-base"></i>
          <input type="file" id="imageInput" accept="image/*" onchange="handleImageUpload(event)" class="hidden">
        </label>

        <!-- Voice Note Recording Button -->
        <button type="button" id="voiceBtn" onclick="toggleVoiceRecording()" class="p-3 text-gray-400 hover:text-red-400 bg-dark-bg border border-gray-800 rounded-xl transition flex-shrink-0" title="تسجيل صوتي">
          <i class="fa-solid fa-microphone text-base"></i>
        </button>

        <!-- Message Input Text -->
        <input type="text" id="messageInput" autocomplete="off" placeholder="اكتب رسالة أو سجل صوتاً..." 
          class="flex-1 bg-dark-bg border border-gray-800 focus:border-brand-500 text-white rounded-xl px-4 py-3 outline-none text-sm transition">

        <!-- Submit Text Button -->
        <button type="submit" class="bg-brand-600 hover:bg-brand-500 text-white font-bold p-3 px-5 rounded-xl transition flex items-center gap-2 shadow-lg flex-shrink-0">
          <span class="hidden sm:inline text-xs">إرسال</span>
          <i class="fa-solid fa-paper-plane text-sm"></i>
        </button>
      </form>
    </div>
  </footer>


  <!-- ================= JAVASCRIPT ENGINE ================= -->
  <script>
    // Anonymous Local Identity Generation
    const randomSeed = Math.floor(Math.random() * 9000 + 1000);
    const currentUser = {
      username: 'مستخدم_' + randomSeed,
      avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${randomSeed}`
    };

    document.getElementById('headerName').textContent = currentUser.username;
    document.getElementById('headerAvatar').src = currentUser.avatar;

    // Direct Mesh Communication State (PeerJS)
    const PUBLIC_ROOM_ID = "public-global-live-room-hub-2026";
    let peer = null;
    let connections = [];

    // Audio State
    let mediaRecorder = null;
    let audioChunks = [];
    let recordStartTime = 0;
    let recordTimerInterval = null;

    window.addEventListener('DOMContentLoaded', () => {
      initPeerMeshNetwork();
    });

    function initPeerMeshNetwork() {
      // Connect to public PeerJS network with standard broadcast fallback
      peer = new Peer('peer_user_' + Date.now() + '_' + Math.floor(Math.random()*1000));

      peer.on('open', (id) => {
        updateStatus(true, "جاهز ومكتمل الاتصال");
        // Try connecting to room host or act as peer
        connectToExistingRoom();
      });

      peer.on('connection', (conn) => {
        setupPeerConnection(conn);
      });

      peer.on('error', (err) => {
        console.warn('Peer network status:', err);
        updateStatus(true, "متصل عبر الشبكة العامة");
      });
    }

    function connectToExistingRoom() {
      // Attempt discovering peers dynamically
      const targetPeerId = PUBLIC_ROOM_ID;
      const conn = peer.connect(targetPeerId);
      if(conn) setupPeerConnection(conn);
    }

    function setupPeerConnection(conn) {
      conn.on('open', () => {
        if (!connections.includes(conn)) {
          connections.push(conn);
        }
        updateStatus(true, `متصل (${connections.length + 1} أجهزة)`);
      });

      conn.on('data', (payload) => {
        renderMessageItem(payload);
      });

      conn.on('close', () => {
        connections = connections.filter(c => c !== conn);
        updateStatus(true, connections.length > 0 ? `متصل (${connections.length + 1} أجهزة)` : "جاهز وفي الانتظار");
      });
    }

    function broadcastPayload(payload) {
      // Render locally
      renderMessageItem(payload);

      // Broadcast to connected peers
      connections.forEach(conn => {
        if (conn.open) {
          conn.send(payload);
        }
      });
    }

    function updateStatus(isOk, text) {
      const statusText = document.getElementById('connectionStatus');
      const statusDot = document.getElementById('statusIndicator');

      if (isOk) {
        statusText.innerHTML = `<i class="fa-solid fa-signal text-emerald-400 text-[10px] ml-1"></i> ${text}`;
        statusDot.className = "absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-dark-card rounded-full";
      } else {
        statusText.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin text-amber-400 text-[10px] ml-1"></i> ${text}`;
        statusDot.className = "absolute bottom-0 right-0 w-3 h-3 bg-amber-500 border-2 border-dark-card rounded-full";
      }
    }

    // --- Message Senders ---
    function handleSendText(e) {
      e.preventDefault();
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;

      const payload = {
        id: 'msg_' + Date.now(),
        type: 'text',
        userName: currentUser.username,
        userAvatar: currentUser.avatar,
        text: text,
        timestamp: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })
      };

      broadcastPayload(payload);
      input.value = '';
    }

    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (evt) {
        const payload = {
          id: 'msg_' + Date.now(),
          type: 'image',
          userName: currentUser.username,
          userAvatar: currentUser.avatar,
          image: evt.target.result,
          timestamp: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })
        };
        broadcastPayload(payload);
      };
      reader.readAsDataURL(file);
    }

    // --- Voice Recording Logic (Web Audio API) ---
    async function toggleVoiceRecording() {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        stopAndSendRecording();
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = event => {
          audioChunks.push(event.data);
        };

        mediaRecorder.onstop = () => {
          stream.getTracks().forEach(track => track.stop());
        };

        mediaRecorder.start();
        recordStartTime = Date.now();
        document.getElementById('recordingBanner').classList.remove('hidden');

        recordTimerInterval = setInterval(() => {
          const elapsed = Math.floor((Date.now() - recordStartTime) / 1000);
          const secs = String(elapsed % 60).padStart(2, '0');
          const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
          document.getElementById('recordTimer').textContent = `${mins}:${secs}`;
        }, 1000);

      } catch (err) {
        alert('تعذر الوصول إلى المايكروفون. يرجى تفعيل الإذن في متصفحك.');
      }
    }

    function cancelRecording() {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
      }
      clearInterval(recordTimerInterval);
      document.getElementById('recordingBanner').classList.add('hidden');
    }

    function stopAndSendRecording() {
      if (!mediaRecorder || mediaRecorder.state !== 'recording') return;

      mediaRecorder.stop();
      clearInterval(recordTimerInterval);
      document.getElementById('recordingBanner').classList.add('hidden');

      mediaRecorder.onstop = () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        const reader = new FileReader();

        reader.onloadend = () => {
          const base64Audio = reader.result;
          const payload = {
            id: 'msg_' + Date.now(),
            type: 'voice',
            userName: currentUser.username,
            userAvatar: currentUser.avatar,
            audio: base64Audio,
            timestamp: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })
          };
          broadcastPayload(payload);
        };

        reader.readAsDataURL(audioBlob);
      };
    }

    // --- Message Render Engine ---
    function renderMessageItem(msg) {
      const list = document.getElementById('messagesList');
      const isMe = currentUser && msg.userName === currentUser.username;

      const item = document.createElement('div');
      item.className = `flex gap-3 max-w-[85%] sm:max-w-[75%] ${isMe ? 'mr-auto flex-row-reverse' : 'ml-auto'}`;

      let contentHTML = '';

      if (msg.type === 'text') {
        contentHTML = `<p class="text-sm leading-relaxed">${escapeHtml(msg.text)}</p>`;
      } else if (msg.type === 'image') {
        contentHTML = `<img src="${msg.image}" class="rounded-xl max-w-full max-h-64 object-cover border border-black/20" onclick="window.open(this.src)">`;
      } else if (msg.type === 'voice') {
        contentHTML = `
          <div class="flex items-center gap-2 py-1">
            <audio controls src="${msg.audio}" class="h-8 max-w-[200px] sm:max-w-[250px]"></audio>
          </div>
        `;
      }

      item.innerHTML = `
        <img src="${msg.userAvatar}" class="w-8 h-8 rounded-lg bg-dark-card border border-gray-800 flex-shrink-0" alt="Avatar">
        <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
          <div class="flex items-center gap-2 mb-1">
            <span class="text-xs font-bold text-gray-400">${msg.userName}</span>
            <span class="text-[10px] text-gray-600">${msg.timestamp}</span>
          </div>
          <div class="p-3 rounded-2xl ${
            isMe 
              ? 'bg-brand-600 text-white rounded-tl-none' 
              : 'bg-dark-card border border-gray-800 text-gray-200 rounded-tr-none'
          }">
            ${contentHTML}
          </div>
        </div>
      `;

      list.appendChild(item);
      const feed = document.getElementById('feedContainer');
      feed.scrollTop = feed.scrollHeight;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
